<header class="bg-zinc-950 text-white border-b border-zinc-800 sticky top-0 z-50 font-sans">
  <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    
    <!-- Logo IFDb + Botão Menu -->
    <div class="flex items-center gap-4">
      <a routerLink="/" class="bg-amber-400 text-black font-black text-xl px-2.5 py-0.5 rounded tracking-tighter hover:bg-amber-300 transition-colors shadow">
        IFDb
      </a>
      
      <button type="button" class="flex items-center gap-1.5 font-bold text-sm hover:bg-zinc-900 px-3 py-1.5 rounded-full transition-colors text-zinc-200">
        <span class="text-lg">☰</span> Menu
      </button>
    </div>

    <!-- Campo de Pesquisa -->
    <div class="flex-1 max-w-2xl flex items-center bg-white rounded overflow-hidden">
      <button type="button" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs font-bold px-3 py-2 border-r border-zinc-300 flex items-center gap-1">
        Tudo <span class="text-[10px]">▼</span>
      </button>
      <input 
        type="text" 
        placeholder="Pesquisar no IFDb" 
        class="w-full px-3 py-1.5 text-black text-sm outline-none placeholder:text-zinc-500"
      />
      <button type="button" class="px-3 text-zinc-500 hover:text-black">
        🔍
      </button>
    </div>

    <!-- Navegação Direita & Estado do Login -->
    <div class="flex items-center gap-4 text-xs font-bold">
      <span class="text-sky-400 hover:underline cursor-pointer hidden md:inline">IFDbPro</span>
      <div class="h-4 w-[1px] bg-zinc-800 hidden md:block"></div>
      
      <button type="button" class="flex items-center gap-1 hover:bg-zinc-900 px-2 py-1.5 rounded text-zinc-200">
        <span>➕</span> Lista de favoritos
      </button>

      @if (database.usuarioLogado()) {
        <div class="flex items-center gap-2 bg-zinc-900 px-3 py-1 rounded-full border border-zinc-800">
          <span class="text-amber-400 font-bold">👤 {{ database.usuarioLogado()?.nome }}</span>
          <button type="button" (click)="database.logout()" class="text-zinc-400 hover:text-red-400 underline ml-1">
            Sair
          </button>
        </div>
      } @else {
        <a routerLink="/login" class="hover:bg-zinc-900 px-3 py-1.5 rounded transition-colors text-zinc-200">
          Fazer login
        </a>
      }

      <span class="text-zinc-400 hover:text-white cursor-pointer">PT ▼</span>
    </div>

  </div>
</header>
