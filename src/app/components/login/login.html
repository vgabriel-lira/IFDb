<div class="bg-black text-white min-h-screen font-sans flex flex-col items-center justify-center p-4 selection:bg-amber-400 selection:text-black">
  
  <div class="mb-6 text-center space-y-2">
    <a routerLink="/" class="inline-block bg-amber-400 text-black font-black text-3xl px-3 py-1 rounded tracking-tighter hover:bg-amber-300 transition-colors">
      IFDb
    </a>
  </div>

  <div class="w-full max-w-md bg-[#121212] border border-zinc-800 rounded-xl p-8 shadow-2xl space-y-6 relative">
    
    <!-- BOTÃO DE FECHAR (VOLTAR) -->
    <a 
      routerLink="/" 
      title="Fechar e voltar à página principal"
      class="absolute top-4 right-4 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white font-bold w-8 h-8 rounded-full flex items-center justify-center transition-colors cursor-pointer border border-zinc-700/50"
    >
      ✕
    </a>

    <div class="border-b border-zinc-800 pb-4 flex justify-between items-center pr-8">
      <h1 class="text-xl font-bold text-white">
        {{ modoCriarConta() ? 'Criar uma conta' : 'Fazer login' }}
      </h1>
      <span class="text-xs text-amber-400 font-semibold">IFDb Oficial</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      @if (modoCriarConta()) {
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-zinc-400">O seu nome</label>
          <input 
            type="text" 
            name="nome"
            [(ngModel)]="nome" 
            placeholder="Nome completo"
            required 
            class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:border-amber-400"
          />
        </div>
      }

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-zinc-400">Endereço de e-mail</label>
        <input 
          type="email" 
          name="email"
          [(ngModel)]="email" 
          placeholder="exemplo@email.com"
          required 
          class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:border-amber-400"
        />
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-zinc-400">Palavra-passe</label>
        <input 
          type="password" 
          name="pass"
          [(ngModel)]="pass" 
          placeholder="Pelo menos 6 caracteres"
          required 
          class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:border-amber-400"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="database.isSaving()"
        class="w-full bg-amber-400 hover:bg-amber-300 disabled:opacity-50 text-black font-black py-2.5 rounded text-sm transition-colors cursor-pointer mt-2"
      >
        {{ database.isSaving() ? 'A processar...' : (modoCriarConta() ? 'Criar conta no IFDb' : 'Fazer Login') }}
      </button>
    </form>

    <div class="pt-4 border-t border-zinc-800 text-center text-xs space-y-2">
      @if (modoCriarConta()) {
        <p class="text-zinc-400">
          Já tem uma conta? 
          <button type="button" (click)="toggleModo()" class="text-amber-400 font-bold hover:underline cursor-pointer ml-1">
            Fazer login
          </button>
        </p>
      } @else {
        <p class="text-zinc-400">
          É novo no IFDb? 
          <button type="button" (click)="toggleModo()" class="text-amber-400 font-bold hover:underline cursor-pointer ml-1">
            Criar a sua conta do IFDb
          </button>
        </p>
      }
    </div>

    <div class="text-center pt-2">
      <a routerLink="/" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">
        ← Voltar para a página principal
      </a>
    </div>

  </div>
</div>
