<div class="bg-black text-white min-h-screen font-sans p-6 selection:bg-amber-400 selection:text-black">
  <div class="max-w-4xl mx-auto space-y-6">
    <a routerLink="/" class="text-amber-400 font-bold hover:underline inline-flex items-center gap-1 text-sm">
      ← Voltar para o início
    </a>

    @if (filme()) {
      <div class="bg-[#121212] border border-zinc-800 rounded-xl p-6 md:p-8 grid grid-cols-1 md:grid-cols-3 gap-8 shadow-2xl">
        <div class="aspect-[2/3] rounded-lg overflow-hidden bg-zinc-900 border border-zinc-800">
          <img 
            [src]="filme()?.imagemUrl || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80'" 
            [alt]="filme()?.titulo" 
            class="w-full h-full object-cover"
          />
        </div>

        <div class="md:col-span-2 space-y-4 flex flex-col justify-between">
          <div class="space-y-3">
            <div class="flex items-center gap-2 text-xs text-amber-400">
              <span>★ 8,4</span>
              <span class="text-zinc-500">•</span>
              <span class="text-zinc-400">{{ filme()?.ano }}</span>
              <span class="text-zinc-500">•</span>
              <span class="bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded text-[10px] font-bold">{{ filme()?.genero }}</span>
            </div>

            <h1 class="text-3xl font-black text-white leading-tight">{{ filme()?.titulo }}</h1>

            <p class="text-sm text-zinc-300 leading-relaxed pt-2">
              {{ filme()?.sinopse || 'Sem sinopse disponível para este filme.' }}
            </p>
          </div>

          <div class="pt-6 border-t border-zinc-800/80 flex items-center justify-between">
            <button 
              type="button" 
              (click)="removerFilme(filme()!.id)" 
              class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded font-bold text-xs transition-colors cursor-pointer"
            >
              Eliminar Filme
            </button>
          </div>
        </div>
      </div>
    } @else {
      <div class="bg-[#121212] border border-zinc-800 rounded-xl p-12 text-center space-y-4">
        <p class="text-zinc-400 text-sm">Filme não encontrado ou carregando...</p>
        <a routerLink="/" class="bg-amber-400 hover:bg-amber-300 text-black font-bold px-4 py-2 rounded text-xs transition-colors inline-block">
          Voltar para o catálogo
        </a>
      </div>
    }
  </div>
</div>
