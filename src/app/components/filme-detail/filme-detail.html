<div class="bg-black text-white min-h-screen p-6 flex flex-col items-center font-sans">
  <div class="max-w-4xl w-full space-y-6">
    
    <a routerLink="/" class="text-amber-400 font-bold hover:underline inline-block text-sm">
      ← Voltar para o início
    </a>

    @if (filme()) {
      <div class="bg-[#121212] border border-zinc-800 rounded-xl p-6 md:p-8 flex flex-col md:flex-row gap-8 shadow-2xl">
        
        <!-- CAPA / POSTER -->
        <div class="w-full md:w-1/3 aspect-[2/3] bg-zinc-900 rounded-lg overflow-hidden flex-shrink-0 border border-zinc-800">
          <img 
            [src]="filme()?.imagemUrl || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80'" 
            [alt]="filme()?.titulo" 
            class="w-full h-full object-cover" 
          />
        </div>

        <!-- INFORMAÇÕES DETALHADAS -->
        <div class="space-y-4 flex-1 flex flex-col justify-between">
          <div class="space-y-4">
            <div class="flex items-center gap-3 text-xs text-zinc-400">
              <span class="text-amber-400 font-bold text-sm">★ 8,4</span>
              <span>•</span>
              <span>{{ filme()?.ano || '2026' }}</span>
              <span>•</span>
              <span class="bg-zinc-800 text-amber-400 px-2.5 py-1 rounded font-bold uppercase tracking-wider text-[10px]">
                {{ filme()?.categoria || 'Destaque' }}
              </span>
            </div>

            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight">
              {{ filme()?.titulo }}
            </h1>

            <p class="text-zinc-300 text-sm md:text-base leading-relaxed">
              {{ filme()?.descricao || 'Sem descrição disponível para este título.' }}
            </p>
          </div>

          <div class="pt-6 border-t border-zinc-800/80 flex items-center justify-between">
            <button 
              type="button" 
              (click)="removerFilme(filme()!.id)" 
              class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-800/50 text-xs font-bold px-4 py-2 rounded-lg transition-colors cursor-pointer"
            >
              Eliminar do Supabase
            </button>
            <span class="text-[10px] text-zinc-500 font-mono">ID: {{ filme()?.id }}</span>
          </div>
        </div>

      </div>
    } @else {
      <div class="text-center py-20 text-zinc-500 font-medium">
        Carregando detalhes do título...
      </div>
    }

  </div>
</div>
