<div class="bg-[#121212] border border-zinc-800 p-6 rounded-xl text-white max-w-xl mx-auto space-y-4 font-sans shadow-2xl">
  <h2 class="text-xl font-bold text-amber-400 border-b border-zinc-800 pb-2 flex items-center gap-2">
    <span class="bg-amber-400 w-1 h-5 inline-block rounded-sm"></span>
    Cadastrar Novo Filme no IFDb
  </h2>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-zinc-400 mb-1">Título do Filme</label>
      <input 
        type="text" 
        name="titulo"
        [(ngModel)]="titulo" 
        placeholder="Ex: Pride and Prejudice"
        required 
        class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-amber-400 text-white placeholder:text-zinc-500"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">Gênero</label>
        <input 
          type="text" 
          name="genero"
          [(ngModel)]="genero" 
          placeholder="Ex: Drama, Ação"
          required 
          class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-amber-400 text-white placeholder:text-zinc-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1">Ano de Lançamento</label>
        <input 
          type="number" 
          name="ano"
          [(ngModel)]="ano" 
          placeholder="Ex: 2026"
          required 
          class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-amber-400 text-white placeholder:text-zinc-500"
        />
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-zinc-400 mb-1">URL da Capa / Poster (Opcional)</label>
      <input 
        type="url" 
        name="imagemUrl"
        [(ngModel)]="imagemUrl" 
        placeholder="https://images.unsplash.com/..."
        class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-amber-400 text-white placeholder:text-zinc-500"
      />
    </div>

    <div>
      <label class="block text-xs font-semibold text-zinc-400 mb-1">Sinopse (Opcional)</label>
      <textarea 
        name="sinopse"
        [(ngModel)]="sinopse" 
        rows="3"
        placeholder="Breve resumo da trama..."
        class="w-full bg-zinc-900 border border-zinc-700 rounded p-2.5 text-sm focus:outline-none focus:border-amber-400 text-white placeholder:text-zinc-500 resize-none"
      ></textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button 
        type="submit" 
        [disabled]="database.isSaving()"
        class="flex-1 bg-amber-400 hover:bg-amber-300 disabled:opacity-50 text-black font-bold py-2.5 rounded text-sm transition-colors cursor-pointer"
      >
        {{ database.isSaving() ? 'A guardar...' : 'Salvar no Supabase' }}
      </button>

      <button 
        type="button" 
        (click)="limparFormulario()" 
        class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-4 py-2.5 rounded text-sm transition-colors cursor-pointer"
      >
        Limpar
      </button>
    </div>
  </form>
</div>
