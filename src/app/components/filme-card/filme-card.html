<article (click)="selected.emit()" tabindex="0" role="button"
  class="group relative h-full bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-lg p-2.5 transition-all flex flex-col justify-between cursor-pointer">
  
  <div class="space-y-2">
    <!-- Pôster 2:3 com o Ícone '+' de Lista do IMDb -->
    <div class="relative aspect-[2/3] w-full overflow-hidden rounded bg-black border border-zinc-800">
      @if (imagemUrl()) {
        <img [src]="imagemUrl()" [alt]="titulo()" class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" />
      } @else {
        <div class="h-full w-full flex items-center justify-center text-zinc-600 text-[10px] uppercase font-bold">Sem Foto</div>
      }

      <!-- Ícone + do IMDb no Canto Superior -->
      <div class="absolute top-0 left-0 bg-zinc-900/90 text-zinc-300 hover:text-white px-2 py-1 rounded-br text-xs font-bold">
        +
      </div>
    </div>

    <!-- Avaliação Star IMDb e Ano -->
    <div class="flex items-center justify-between text-xs px-0.5 pt-1">
      <div class="flex items-center gap-1 text-amber-400 font-bold">
        <span>★</span>
        <span class="text-white">8,5</span>
      </div>
      <span class="text-zinc-500 font-medium text-[11px]">{{ ano() }}</span>
    </div>

    <!-- Título do Filme -->
    <div class="px-0.5">
      <h3 class="text-white font-bold text-xs group-hover:text-amber-400 transition-colors line-clamp-1">
        {{ titulo() }}
      </h3>
      <span class="text-[10px] text-zinc-400 block uppercase font-semibold mt-0.5">
        {{ genero() }}
      </span>
    </div>
  </div>

  <!-- Rodapé do Card com Botão de Ação IMDb -->
  <div class="pt-2 mt-2 border-t border-zinc-800/60 flex items-center justify-between gap-1">
    <button type="button" class="w-full bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-bold text-[11px] py-1 px-2 rounded transition-colors text-center">
      ▶ Trailer
    </button>
    <button type="button" 
      (click)="$event.stopPropagation(); deleteRequested.emit()" 
      class="text-[10px] font-bold text-red-400 hover:text-white bg-red-500/10 hover:bg-red-600 rounded px-2 py-1 transition-all">
      x
    </button>
  </div>

</article>
